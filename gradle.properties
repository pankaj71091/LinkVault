# Project-wide Gradle settings.

# JVM heap size for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX package structure (required — this project has no support-library fallback).
android.useAndroidX=true

# Kotlin code style used by IDE formatters.
kotlin.code.style=official

# Disable automatic non-transitive R classes opt-in message; keep each module's
# R class scoped to only the resources it declares/depends on directly.
android.nonTransitiveRClass=true

# Enable Gradle configuration cache for faster incremental builds.
org.gradle.configuration-cache=true
